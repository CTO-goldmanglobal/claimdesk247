<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Goldman Forge Legal — Accident intake{% endblock %}</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 1.5rem; color: #1a202c; line-height: 1.5; }
    h1, h2, h3 { color: #1a365d; }
    .panel { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 1rem 1.25rem; margin: 1rem 0; }
    .disclaimer { background: #fffaf0; border-left: 4px solid #d69e2e; padding: 0.75rem 1rem; font-size: 0.95rem; }
    .chat { background: #ebf8ff; border: 1px solid #bee3f8; border-radius: 8px; padding: 0.75rem 1rem; margin: 0.5rem 0; }
    .chat .label { font-size: 0.8rem; color: #2c5282; font-weight: 600; }
    label { display: block; margin: 0.5rem 0 0.25rem; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; font: inherit; }
    button { background: #2b6cb0; color: white; padding: 0.6rem 1.2rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #2c5282; }
    .progress { font-size: 0.85rem; color: #4a5568; margin-bottom: 1rem; }
    .error { color: #c53030; font-size: 0.9rem; }
    .ref { font-family: ui-monospace, Menlo, monospace; background: #edf2f7; padding: 0.15rem 0.4rem; border-radius: 3px; }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
