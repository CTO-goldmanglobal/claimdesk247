# Stage 3 Acceptance Tests — Voice · Tow · Rental · Dashboard
# Fables-specified. Green required across BOTH this suite and Stage 2's 30 (G-39 regression).
# Voice cases run through VoiceDialogManager as text transcripts (STT/TTS stubbed) — deterministic, no audio.
# IDs permanent. channel noted per case.

meta:
  stage: 3
  spec_version: rule-tree.nsw.v3.json   # post CR-3-04
  regression_suite: ../stage-2/acceptance-tests.stage2.yaml   # all 30 must pass
  also_assert: { stage2_tests_green: true }   # G-39

cases:

# ---- G-29: engine parity voice vs web ----
- id: T-3-001
  gate: G-29
  channel: voice
  desc: same rear-end intake via voice yields same band as web T-2-001
  inputs: { channel: voice, state: NSW, accident_type: rear-end, user_position: front, user_motion: stopped, chain_count: 2, sudden_braking: no, brake_lights: working, damage: {user: rear, other: front}, injuries: none }
  expect: { band: likely, same_engine_as_web: true, classify_fn: "app.engine.classify" }

- id: T-3-002
  gate: G-29
  channel: voice
  desc: voice give-way unclear matches web T-2-007 band
  inputs: { channel: voice, state: NSW, accident_type: T-intersection, simultaneous_entry: yes, sight_lines: disputed, injuries: none }
  expect: { band: unclear, same_engine_as_web: true }

# ---- G-30: recording consent before PII ----
- id: T-3-003
  gate: G-30
  channel: voice
  inputs: { channel: voice, recording_consent: accepted, then_capture: name }
  expect: { consent_before_pii: true, recording_active: true }

- id: T-3-004
  gate: G-30
  channel: voice
  inputs: { channel: voice, recording_consent: declined }
  expect: { recording_active: false, pii_persisted_before_consent: false, path: non_recorded_or_callback }

# ---- G-31: DTMF fallback ----
- id: T-3-005
  gate: G-31
  channel: voice
  desc: accident_type via keypad equals speech value
  inputs: { channel: voice, slot: accident_type, dtmf: "1", mapping: {"1": rear-end} }
  expect: { slot_value: rear-end, equals_speech_path: true }

- id: T-3-006
  gate: G-31
  channel: voice
  desc: every enum slot exposes a DTMF map
  inputs: { assert: dtmf_map_present_for, slots: [state, accident_type, damage, control_devices, police_attendance, injuries] }
  expect: { all_have_dtmf: true }

# ---- G-32: escalation -> warm transfer / callback ----
- id: T-3-007
  gate: G-32
  channel: voice
  desc: serious injury during business hours -> warm transfer, no fault output
  inputs: { channel: voice, business_hours: true, injuries: serious }
  expect: { escalation: esc-injury, action: warm_transfer, fault_output_shown: false, terminal: true }

- id: T-3-008
  gate: G-32
  channel: voice
  desc: dispute after hours -> callback + urgent brief
  inputs: { channel: voice, business_hours: false, accident_type: rear-end, user_position: behind, user_motion: moving, then_user_disputes_summary: true, injuries: none }
  expect: { escalation: esc-dispute, action: callback_booking, brief_flagged_urgent: true, terminal: true }

- id: T-3-009
  gate: G-32
  channel: voice
  desc: advice request on voice -> deflect + transfer/callback, never answered
  inputs: { channel: voice, user_asks: "whose fault is it legally?", injuries: none }
  expect: { escalation: esc-advice, advice_answered: false, deflected: true }

# ---- G-37: voice disclaimer cadence ----
- id: T-3-010
  gate: G-37
  channel: voice
  desc: full master read once, short-form on second fault mention
  inputs: { channel: voice, two_fault_outputs_in_session: true }
  expect: { master_full_count: 1, short_form_used: true, short_form_words_max: 40, four_elements_present: true }

# ---- G-40: confirm-back + reprompt cap ----
- id: T-3-011
  gate: G-40
  channel: voice
  inputs: { channel: voice, slot: user_vehicle, value: "white Corolla ABC123" }
  expect: { confirm_back_prompted: true }

- id: T-3-012
  gate: G-40
  channel: voice
  inputs: { channel: voice, slot: rego, attempts: [unclear, unclear, unclear] }
  expect: { reprompts: 2, then: callback_offered, dead_end: false }

# ---- G-35: tow flow ----
- id: T-3-013
  gate: G-35
  channel: voice
  desc: tow hazard yes -> 000 advisory before continuing
  inputs: { channel: voice, flow: tow, hazard: fuel_leak }
  expect: { advise_000_first: true, advisory_before_continue: true }

- id: T-3-014
  gate: G-35
  channel: voice
  desc: tow happy path captures slots and emits provider ref
  inputs: { channel: voice, flow: tow, location: "cnr King & George, Sydney", on_surface: road, vehicle: {make: Toyota, model: Corolla, colour: white, rego: ABC123}, callback: "0400000000" }
  expect: { slots_captured: [location, on_surface, vehicle, callback], emits: "{{TOW_PROVIDER_REF}}", logged_to_intake: true }

# ---- rental flow + framing ----
- id: T-3-015
  gate: G-35
  channel: web
  desc: rental eligibility uses general-info framing, not "entitled"
  inputs: { channel: web, flow: rental, comprehensive: unknown, other_at_fault: unknown }
  expect: { framing_general: true, forbidden_phrases_absent: ["you are entitled", "you will get", "they will pay"], disclaimer_or_lawyer_pursue_present: true }

- id: T-3-016
  gate: G-35
  channel: web
  desc: rental happy path captures licence/class/location/duration, emits partner ref
  inputs: { channel: web, flow: rental, licence: {number: "1234", state: NSW, expiry: "2028-01-01"}, class: sedan, pickup: "Sydney CBD", duration: "5 days" }
  expect: { slots_captured: [licence, class, pickup, duration], emits: "{{RENTAL_PARTNER_REF}}", noted_in_intake: true }

# ---- CR-3-01: parking maps to reversing ----
- id: T-3-017
  gate: G-38
  channel: web
  inputs: { channel: web, state: NSW, accident_type: parking, injuries: none }
  expect: { mapped_scenario: s5-reversing, location_flag: car_park }

# ---- CR-3-02: damage enum ----
- id: T-3-018
  gate: G-38
  channel: web
  inputs: { channel: web, slot: damage, value: "scratched a bit on the side" }
  expect: { rejected_free_text: true, requires_enum: [front, rear, left, right, multiple] }

# ---- CR-3-04: rule tree v3 clean ----
- id: T-3-019
  gate: G-38
  channel: engine
  inputs: { assert: no_out_of_enum_band_anywhere, file: rule-tree.nsw.v3.json, scan: [outputs, band_logic] }
  expect: { out_of_enum_bands: 0, version: "3.0.0" }

# ---- G-33: role-based access ----
- id: T-3-020
  gate: G-33
  channel: dashboard
  inputs: { role: customer, request: dashboard }
  expect: { access: denied, http: 403_or_redirect }

- id: T-3-021
  gate: G-33
  channel: dashboard
  inputs: { role: anonymous, request: intake_record }
  expect: { access: denied, enforced: server_side }

- id: T-3-022
  gate: G-33
  channel: dashboard
  inputs: { role: panel_shop_staff, request: dashboard_list }
  expect: { access: granted, fields: [date, customer, scenario, band] }

- id: T-3-023
  gate: G-33
  channel: dashboard
  inputs: { role: legal_staff, request: intake_brief }
  expect: { access: granted, brief_visible: true }

# ---- G-34: audit log immutable + export ----
- id: T-3-024
  gate: G-34
  channel: dashboard
  inputs: { role: legal_staff, action: attempt_edit_audit_log }
  expect: { mutation: rejected, log_append_only: true }

- id: T-3-025
  gate: G-34
  channel: dashboard
  inputs: { role: admin, action: export_audit_log }
  expect: { export: success, contains: [timestamp, session_id, inputs, rule_path, output] }

# ---- G-36: legal-firm intake brief ----
- id: T-3-026
  gate: G-36
  channel: dashboard
  inputs: { generate: intake_brief, session: completed_rear_end }
  expect: { fields_present: [intake_fields, band, rule_refs, escalation_flags, evidence_gaps, recommended_action, verbatim_quotes, tow_rental_status], customer_facing: false, percentage_in_brief: false }

# ---- G-39 regression marker ----
- id: T-3-027
  gate: G-39
  channel: regression
  inputs: { run: stage2_suite }
  expect: { stage2: "30/30", any_red: false }

# ---- T1: G-PROD-LOCK / G-VER — Legal Head signoff is enforced. ----
- id: T-1-01
  gate: G-PROD-LOCK
  channel: engine
  desc: signed scenario with current content hash returns a band (G-VER happy path)
  inputs: { run: classify_signed_s1 }
  expect: { band_in: [likely, possible, unclear, insufficient], escalation: null }

- id: T-1-02
  gate: G-PROD-LOCK
  channel: engine
  desc: unsigned scenario on the live rule tree escalates (G-PROD-LOCK default)
  inputs: { run: classify_unsigned_s1 }
  expect: { band: null, escalation: "unsigned-scenario" }

- id: T-1-03
  gate: G-VER
  channel: engine
  desc: synthetic stale-signoff is detected (approved=True, mismatched version hash)
  inputs: { run: classify_stale_signoff }
  expect: { reason: "stale-signoff" }

- id: T-1-04
  gate: G-VER
  channel: engine
  desc: _compute_scenarios_hash is deterministic, 64 hex chars, ignores legal_signoff
  inputs: { run: hash_determinism }
  expect: { length: 64, legal_signoff_stripped: true }

# ---- T6: scenario-question injection (L1 dependency) ----
- id: T-6-01
  gate: G-T6
  channel: engine
  desc: start_scenario_questions returns the first scenario question and enters S3.5
  inputs: { run: t6_start }
  expect: { state: "S3.5-INJECT-QUESTIONS", first_question: s1-q1 }

- id: T-6-02
  gate: G-T6
  channel: engine
  desc: submit a valid scenario answer; advances to the next question and persists to intake
  inputs: { run: t6_advance }
  expect: { next: s1-q2, persisted: user_position }

- id: T-6-03
  gate: G-T6
  channel: engine
  desc: answering all scenario questions sets ready_to_classify and returns to S4-CLASSIFY
  inputs: { run: t6_complete }
  expect: { ready_to_classify: true, state: "S4-CLASSIFY" }

- id: T-6-04
  gate: G-T6
  channel: engine
  desc: invalid scenario answer re-prompts without leaving S3.5
  inputs: { run: t6_reprompt }
  expect: { reprompt: true }

- id: T-6-05
  gate: G-T6
  channel: engine
  desc: scenario-question re-prompt cap escalates to SX-ESCALATE with a reference
  inputs: { run: t6_reprompt_cap }
  expect: { escalation: "reprompt-cap", end_state: "SX-ESCALATE" }

- id: T-6-06
  gate: G-T6
  channel: engine
  desc: integer scenario-question type rejects non-integers and accepts integers
  inputs: { run: t6_integer }
  expect: { rejects_non_int: true, accepts_int: true }

- id: T-6-07
  gate: G-T6
  channel: engine
  desc: no resolvable scenario passes straight through to classify (no questions)
  inputs: { run: t6_no_scenario }
  expect: { ready_to_classify: true, state: "S4-CLASSIFY" }

# ---- T4/T5: Phase-2 Tier-1 scenarios (s7–s10, rule tree v3.1.0) ----
- id: T-7-01
  gate: G-T4
  channel: engine
  desc: car-park — aisle vehicle vs reversing-from-bay -> likely
  inputs: { run: t7_carpark_likely }
  expect: { band: likely, scenario: s7-car-park }
- id: T-7-02
  gate: G-T4
  channel: engine
  desc: car-park — both reversing -> unclear
  inputs: { run: t7_carpark_unclear }
  expect: { band: unclear, scenario: s7-car-park }
- id: T-7-03
  gate: G-T4
  channel: engine
  desc: signalised — user on green going straight -> likely
  inputs: { run: t7_signal_likely }
  expect: { band: likely, scenario: s8-signalised-intersection }
- id: T-7-04
  gate: G-T4
  channel: engine
  desc: signalised — light unsure -> unclear
  inputs: { run: t7_signal_unclear }
  expect: { band: unclear, scenario: s8-signalised-intersection }
- id: T-7-05
  gate: G-T4
  channel: engine
  desc: right-turn — user straight, other turning, no arrow -> likely
  inputs: { run: t7_rightturn_likely }
  expect: { band: likely, scenario: s9-right-turn-oncoming }
- id: T-7-06
  gate: G-T4
  channel: engine
  desc: right-turn — turning driver had green arrow -> unclear
  inputs: { run: t7_rightturn_unclear }
  expect: { band: unclear, scenario: s9-right-turn-oncoming }
- id: T-7-07
  gate: G-T4
  channel: engine
  desc: sideswipe — user holding lane, other changing -> likely
  inputs: { run: t7_sideswipe_likely }
  expect: { band: likely, scenario: s10-sideswipe-same-direction }
- id: T-7-08
  gate: G-T4
  channel: engine
  desc: sideswipe — both changing lanes -> unclear
  inputs: { run: t7_sideswipe_unclear }
  expect: { band: unclear, scenario: s10-sideswipe-same-direction }
- id: T-7-09
  gate: G-T4
  channel: engine
  desc: parked car hit — lawfully parked & stationary -> likely
  inputs: { run: t7_parked_likely }
  expect: { band: likely, scenario: s11-parked-vehicle }
- id: T-7-10
  gate: G-T4
  channel: engine
  desc: parked car hit — parked illegally -> possible
  inputs: { run: t7_parked_possible }
  expect: { band: possible, scenario: s11-parked-vehicle }

# ---- Intake-clarity: NSW-only callback + unmapped-type callback (no dead ends) ----
- id: T-8-01
  gate: G-21
  channel: web
  desc: NSW-only — choosing 'outside_nsw' routes to a human callback with a reference
  inputs: { run: nsw_outside_callback }
  expect: { escalation: state-scope, end_state: SX-ESCALATE, reference: true }
- id: T-8-02
  gate: G-T6
  channel: web
  desc: "'not_listed' accident type routes to a human callback immediately (lead captured)"
  inputs: { run: unmapped_type_callback }
  expect: { escalation: unmapped-accident-type, end_state: SX-ESCALATE, reference: true }

coverage_assertion:
  gates_exercised: [G-29, G-30, G-31, G-32, G-33, G-34, G-35, G-36, G-37, G-38, G-39, G-40, G-PROD-LOCK, G-VER, G-T6, G-T4]
  crs_covered: [CR-3-01, CR-3-02, CR-3-04]
  voice_engine_parity: true
  regression: stage2_30_green
